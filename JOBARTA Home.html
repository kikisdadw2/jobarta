document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ilik\">Saya punya usaha<\u002Fa>\n      <a href=\"#daftar\" style=\"padding:10px 16px; background:#0A1B20; color:#E2E0D9; font-weight:700; box-shadow:4px 4px 0 #BF6B25\" style-hover=\"background:#BF6B25; color:#0A1B20; box-shadow:4px 4px 0 #0A1B20\">Cari kerja dekat rumah<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"display:grid; grid-template-columns:1fr 380px; border-bottom:3px solid #0A1B20\">\n    <div style=\"padding:56px 32px 44px; border-right:1px solid #0A1B20\">\n      \n      <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding-bottom:12px; border-bottom:3px solid #0A1B20; margin-bottom:28px\">\n        <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.14em; color:#BF6B25\">EDISI 21 AGUSTUS 2026<\u002Fspan>\n        <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.14em; color:#3F4C51\">JAKARTA SELATAN · GRATIS UNTUK PELAMAR<\u002Fspan>\n      <\u002Fdiv>\n\n      <h1 style=\"margin:0\">\n        <span style=\"display:block; font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:148px; line-height:.8; letter-spacing:-.03em; text-transform:uppercase\">Jalan kiki<\u002Fspan>\n        <span style=\"display:flex; align-items:center; gap:16px; margin-top:16px\">\n          <span style=\"flex:0 0 auto; font-family:'Big Shoulders Display',sans-serif; font-weight:700; font-size:50px; line-height:.92; text-transform:uppercase; background:#BF6B25; padding:3px 12px\">ke tempat kerja<\u002Fspan>\n          <span style=\"flex:1; height:3px; background:#0A1B20\"><\u002Fspan>\n        <\u002Fspan>\n      <\u002Fh1>\n      <p style=\"font-size:19px; line-height:1.5; max-width:50ch; color:#3F4C51; margin:26px 0 34px\">\n        Setiap lowongan di JOBARTA punya titik di peta dan perkiraan ongkos hariannya. Isi dua kolom di bawah, papan langsung menyesuaikan.\n      <\u002Fp>\n\n      <div id=\"daftar\" style=\"max-width:620px; border:3px solid #0A1B20; background:#EFEEE9; box-shadow:10px 10px 0 #0A1B20\">\n        <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:11px 18px; background:#0A1B20; color:#C0C7C2; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em\">\n          <span>FORMULIR PENCARIAN — ISI SEPERTI KALIMAT<\u002Fspan>\n          <span style=\"color:#BF6B25\">NO. 001<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:24px 20px 22px\">\n          <div style=\"font-size:21px; line-height:2; color:#0A1B20\">\n            Saya tinggal di\n            <input type=\"text\" placeholder=\"kelurahan / pasar\" style=\"width:236px; padding:2px 6px 3px; font-family:'Big Shoulders Display',sans-serif; font-weight:700; font-size:27px; color:#BF6B25; background:transparent; border:none; border-bottom:3px solid #0A1B20; outline:none\" style-focus=\"border-bottom-color:#BF6B25\">\n            dan sanggup pergi sejauh\n            <span style=\"position:relative; display:inline-block\">\n              <span sc-camel-on-click=\"{{ toggleOpen }}\" style=\"display:inline-flex; align-items:baseline; gap:7px; padding:2px 6px 3px; font-family:'Big Shoulders Display',sans-serif; font-weight:700; font-size:27px; color:#BF6B25; border-bottom:3px solid {{ pickerBorder }}; cursor:pointer; user-select:none; transition:letter-spacing .12s ease\" style-hover=\"letter-spacing:.02em\">\n                {{ radius }} km\n                <span style=\"display:inline-block; font-size:14px; color:#0A1B20; transform:{{ caretRot }}; transition:transform .18s ease\">▾<\u002Fspan>\n              <\u002Fspan>\n              <sc-if value=\"{{ open }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"position:absolute; left:0; top:calc(100% + 8px); z-index:40; display:block; min-width:190px; border:3px solid #0A1B20; background:#EFEEE9; box-shadow:7px 7px 0 #BF6B25; animation:jbPop .16s cubic-bezier(.2,.9,.3,1.2) both; transform-origin:top left\">\n                  <span style=\"display:block; padding:8px 12px; background:#0A1B20; color:#87857F; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.14em\">SANGGUP PERGI SEJAUH<\u002Fspan>\n                  <sc-for list=\"{{ radiusOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <span sc-camel-on-click=\"{{ o.onClick }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 12px; cursor:pointer; border-bottom:1px solid rgba(10,27,32,.18); background:{{ o.bg }}; color:{{ o.fg }}; transition:background .1s linear, padding-left .12s ease\" style-hover=\"background:#0A1B20; color:#E2E0D9; padding-left:18px\">\n                      <span style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:700; font-size:24px; line-height:1\">{{ o.label }}<\u002Fspan>\n                      <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.06em; opacity:.75\">{{ o.note }}<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fspan>\n            dari rumah.\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-top:22px; padding-top:20px; border-top:1px dashed #87857F\">\n            <button style=\"padding:16px 28px; font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:26px; letter-spacing:.02em; text-transform:uppercase; color:#E2E0D9; background:#0A1B20; border:none; cursor:pointer\" style-hover=\"background:#BF6B25; color:#0A1B20\">Buka papan saya<\u002Fbutton>\n            <span style=\"font-family:'Space Mono',monospace; font-size:12px; line-height:1.5; color:#3F4C51\">{{ shownCount }} LOWONGAN COCOK<br>TANPA CV, TANPA BIAYA<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#3F4C51; margin-top:16px; letter-spacing:.04em\">DIPERBARUI HARI INI 06.00 WIB · 59 LOWONGAN AKTIF DI AREA PILOT<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:relative; padding:30px 28px 34px; background:#0A1B20; color:#C0C7C2; display:flex; flex-direction:column; gap:0; overflow:hidden\">\n      <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding-bottom:16px; border-bottom:2px solid #87857F\">\n        <span style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:30px; line-height:1; text-transform:uppercase; color:#E2E0D9\">Daftar keluhan<\u002Fspan>\n        <span style=\"font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.12em; color:#87857F\">DARI 47 WAWANCARA<\u002Fspan>\n      <\u002Fdiv>\n\n      <sc-for list=\"{{ pains }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div style=\"padding:20px 0 18px; border-bottom:1px solid rgba(135,133,127,.35)\">\n          <div style=\"display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:start\">\n            <span style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:30px; line-height:.8; color:#3F4C51\">{{ p.n }}<\u002Fspan>\n            <span style=\"font-size:15px; line-height:1.4; color:#87857F; text-decoration:line-through; text-decoration-color:#BF6B25; text-decoration-thickness:2px\">{{ p.text }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:34px 1fr; gap:10px; margin-top:10px\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:13px; color:#BF6B25; text-align:right\">↳<\u002Fspan>\n            <span style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:700; font-size:22px; line-height:1.02; text-transform:uppercase; color:#E2E0D9\">{{ p.fix }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <div style=\"display:flex; align-items:center; gap:14px; margin-top:26px\">\n        <div style=\"flex:1; height:2px; background:#3F4C51\"><\u002Fdiv>\n        <div style=\"padding:10px 14px; border:2px solid #BF6B25; outline:1px solid #BF6B25; outline-offset:3px; transform:rotate(-4deg); font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:20px; letter-spacing:.04em; text-transform:uppercase; color:#BF6B25; white-space:nowrap\">Tiga-tiganya beres<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"papan\" style=\"border-bottom:3px solid #0A1B20\">\n    <div style=\"display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:20px; padding:36px 32px 20px\">\n      <div>\n        <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.14em; color:#BF6B25; margin-bottom:10px\">01 — PAPAN LOWONGAN HARI INI<\u002Fdiv>\n        <h2 style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:56px; line-height:.92; margin:0; text-transform:uppercase\">{{ shownCount }} lowongan dalam {{ radius }} km<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:8px\">\n        <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em; color:#3F4C51; margin-right:6px\">ATUR RADIUS<\u002Fspan>\n        <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"padding:10px 15px; font-family:'Space Mono',monospace; font-size:12px; font-weight:700; letter-spacing:.04em; cursor:pointer; border:2px solid #0A1B20; background:{{ c.bg }}; color:{{ c.fg }}\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:56px 1fr 150px 108px 132px 150px 132px; gap:0; padding:0 32px 10px; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em; color:#3F4C51; border-bottom:1px solid #0A1B20\">\n      <span>NO<\u002Fspan><span>POSISI &amp; PEREKRUT<\u002Fspan><span>AREA<\u002Fspan><span>JARAK<\u002Fspan><span>ONGKOS/HARI<\u002Fspan><span>GAJI<\u002Fspan><span><\u002Fspan>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n      <div sc-camel-on-mouse-enter=\"{{ r.onEnter }}\" sc-camel-on-mouse-leave=\"{{ r.onLeave }}\" style=\"display:grid; grid-template-columns:56px 1fr 150px 108px 132px 150px 132px; align-items:center; gap:0; padding:18px 32px; border-bottom:1px solid rgba(10,27,32,.28); background:{{ r.bg }}; color:{{ r.fg }}; transition:background .12s linear\">\n        <span style=\"font-family:'Space Mono',monospace; font-size:13px; color:{{ r.dim }}\">{{ r.no }}<\u002Fspan>\n        <span>\n          <span style=\"display:block; font-family:'Big Shoulders Display',sans-serif; font-weight:700; font-size:27px; line-height:1; text-transform:uppercase\">{{ r.title }}<\u002Fspan>\n          <span style=\"display:block; font-size:13px; margin-top:5px; color:{{ r.dim }}\">{{ r.company }} · {{ r.tag }}<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-size:14px\">{{ r.area }}<\u002Fspan>\n        <span style=\"font-family:'Space Mono',monospace; font-size:14px; font-weight:700; color:{{ r.accent }}\">{{ r.dist }}<\u002Fspan>\n        <span style=\"font-family:'Space Mono',monospace; font-size:13px\">{{ r.ongkos }}<\u002Fspan>\n        <span style=\"font-family:'Space Mono',monospace; font-size:13px\">{{ r.salary }}<\u002Fspan>\n        <span style=\"text-align:right\">\n          <span style=\"display:inline-block; padding:9px 14px; font-size:13px; font-weight:700; border:2px solid {{ r.btnBorder }}; background:{{ r.btnBg }}; color:{{ r.btnFg }}; cursor:pointer\">Lamar<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; padding:22px 32px\">\n      <span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#3F4C51; letter-spacing:.06em\">{{ hiddenNote }}<\u002Fspan>\n      <a href=\"#daftar\" style=\"font-weight:700; font-size:15px; border-bottom:2px solid #BF6B25\">Lihat semuanya di peta →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"ongkos\" style=\"display:grid; grid-template-columns:1fr 1fr; border-bottom:3px solid #0A1B20\">\n    <div style=\"padding:56px 32px; border-right:1px solid #0A1B20\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.14em; color:#BF6B25; margin-bottom:16px\">02 — HITUNGAN YANG SERING DILUPAKAN<\u002Fdiv>\n      <h2 style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:62px; line-height:.9; margin:0 0 20px; text-transform:uppercase\">Gaji besar bisa habis di jalan<\u002Fh2>\n      <p style=\"font-size:17px; line-height:1.6; max-width:46ch; color:#3F4C51; margin:0 0 26px\">\n        Kerja 18 km dari rumah artinya dua jam sehari di jalan dan ongkos yang menggerus gaji tiap bulan. Papan JOBARTA menampilkan angka itu di setiap lowongan, bukan menyembunyikannya.\n      <\u002Fp>\n      <div style=\"display:flex; flex-wrap:wrap; gap:10px\">\n        <sc-for list=\"{{ pledge }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <span style=\"padding:9px 13px; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.06em; border:1px solid #0A1B20; background:#EFEEE9\">{{ p }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:56px 32px; background:#3F4C51; color:#E2E0D9\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.16em; color:#C0C7C2; margin-bottom:26px\">SIMULASI — RADIUS {{ radius }} KM VS 18 KM<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:1px solid rgba(226,224,217,.3)\">\n        <div style=\"padding:22px 20px 22px 0; border-right:1px solid rgba(226,224,217,.3)\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em; color:#C0C7C2; margin-bottom:10px\">DEKAT RUMAH<\u002Fdiv>\n          <div style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:52px; line-height:1; color:#BF6B25\">{{ nearDaily }}<\u002Fdiv>\n          <div style=\"font-size:13px; color:#C0C7C2; margin-top:6px\">per hari · {{ nearTime }} di jalan<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 0 22px 20px\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em; color:#C0C7C2; margin-bottom:10px\">LINTAS KOTA<\u002Fdiv>\n          <div style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:52px; line-height:1\">Rp 26 rb<\u002Fdiv>\n          <div style=\"font-size:13px; color:#C0C7C2; margin-top:6px\">per hari · 2 jam 10 mnt di jalan<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(226,224,217,.3); padding-top:26px; margin-top:4px\">\n        <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em; color:#C0C7C2; margin-bottom:10px\">SELISIH SEBULAN (22 HARI KERJA)<\u002Fdiv>\n        <div style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:88px; line-height:.9; color:#BF6B25\">{{ monthlySave }}<\u002Fdiv>\n        <div style=\"font-size:15px; line-height:1.5; color:#E2E0D9; margin-top:10px; max-width:38ch\">Uang yang tetap di kantongmu, plus {{ monthlyHours }} jam sebulan yang tidak dihabiskan di angkot.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:56px 32px; border-bottom:3px solid #0A1B20\">\n    <div style=\"display:grid; grid-template-columns:minmax(260px,30%) 1fr; gap:48px; align-items:start\">\n      <div>\n        <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.14em; color:#BF6B25; margin-bottom:16px\">03 — JANJI KAMI<\u002Fdiv>\n        <h2 style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:48px; line-height:.94; margin:0 0 16px; text-transform:uppercase\">Tidak ada perekrut yang belum diperiksa<\u002Fh2>\n        <div style=\"display:inline-block; padding:12px 16px; border:3px solid #BF6B25; color:#BF6B25; font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:20px; text-transform:uppercase; transform:rotate(-3deg)\">Diperiksa manual<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-left:1px solid #0A1B20\">\n        <sc-for list=\"{{ trust }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"padding:0 24px 8px; border-right:1px solid #0A1B20\">\n            <div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#BF6B25; margin-bottom:14px\">{{ t.n }}<\u002Fdiv>\n            <div style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:700; font-size:28px; line-height:1; text-transform:uppercase; margin-bottom:10px\">{{ t.title }}<\u002Fdiv>\n            <div style=\"font-size:14px; line-height:1.55; color:#3F4C51\">{{ t.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"pemilik\" style=\"padding:56px 32px; background:#0A1B20; color:#E2E0D9; border-bottom:3px solid #0A1B20\">\n    <div style=\"display:grid; grid-template-columns:1fr 420px; gap:56px; align-items:center\">\n      <div>\n        <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.14em; color:#BF6B25; margin-bottom:16px\">UNTUK PEMILIK USAHA<\u002Fdiv>\n        <h2 style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:64px; line-height:.9; margin:0 0 18px; text-transform:uppercase\">Berhenti tempel kertas di kaca toko<\u002Fh2>\n        <p style=\"font-size:17px; line-height:1.6; max-width:50ch; color:#C0C7C2; margin:0 0 28px\">\n          Kertas hanya dilihat orang yang lewat. Pin lokasi usahamu di JOBARTA dan lowonganmu muncul di papan setiap orang dalam radius 5 km — mereka yang paling mungkin bertahan lama karena rumahnya dekat.\n        <\u002Fp>\n        <div style=\"display:flex; align-items:center; gap:18px; flex-wrap:wrap\">\n          <a href=\"#daftar\" style=\"padding:16px 24px; background:#BF6B25; color:#0A1B20; font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:24px; text-transform:uppercase; box-shadow:5px 5px 0 #E2E0D9\" style-hover=\"background:#E2E0D9; color:#0A1B20; box-shadow:5px 5px 0 #BF6B25\">Posting gratis masa pilot<\u002Fa>\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#87857F; letter-spacing:.06em\">VERIFIKASI 1×24 JAM KERJA<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:2px dashed #87857F; padding:26px 22px 0; background:rgba(63,76,81,.35)\">\n        <div style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:40px; line-height:.9; text-align:center; text-transform:uppercase; color:#E2E0D9\">Dibutuhkan<br>karyawan<\u002Fdiv>\n        <div style=\"text-align:center; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.1em; color:#87857F; margin:14px 0 20px\">CARA LAMA — SEKALI TEMPEL, SEMINGGU SEPI<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding-bottom:0\">\n          <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <div style=\"padding:14px 4px; border:1px dashed #87857F; border-bottom:none; font-family:'Space Mono',monospace; font-size:9px; text-align:center; color:#C0C7C2; writing-mode:vertical-rl; margin:0 auto; transition:transform .15s ease\" style-hover=\"transform:translateY(6px); color:#BF6B25\">{{ t }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:76px 32px 84px; text-align:center\">\n    <h2 style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:104px; line-height:.86; margin:0 auto 22px; max-width:22ch; text-transform:uppercase\">Papan hari ini sudah dibuka<\u002Fh2>\n    <p style=\"font-size:18px; line-height:1.55; color:#3F4C51; max-width:50ch; margin:0 auto 34px\">Masuk daftar akses awal Pasar Minggu, Jagakarsa, dan Cilandak. Kami buka bertahap supaya setiap area punya cukup lowongan sebelum kamu masuk.<\u002Fp>\n    <div style=\"display:flex; flex-wrap:wrap; justify-content:center; max-width:560px; margin:0 auto 16px; border:3px solid #0A1B20; background:#EFEEE9; box-shadow:8px 8px 0 #BF6B25\">\n      <input type=\"email\" placeholder=\"nama@email.com\" style=\"flex:1; min-width:220px; padding:18px; font-family:Archivo,sans-serif; font-size:16px; background:transparent; border:none; outline:none; color:#0A1B20\">\n      <button style=\"padding:18px 26px; font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:22px; text-transform:uppercase; color:#E2E0D9; background:#0A1B20; border:none; cursor:pointer\" style-hover=\"background:#BF6B25; color:#0A1B20\">Ambil akses<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.08em; color:#87857F\">SISA 20 KURSI BETA PER KECAMATAN · GRATIS SELAMANYA UNTUK PELAMAR<\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:18px; padding:22px 32px; border-top:3px solid #0A1B20; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.1em; color:#3F4C51\">\n    <span style=\"font-family:'Big Shoulders Display',sans-serif; font-weight:900; font-size:22px; letter-spacing:0; color:#0A1B20\">JOBARTA<\u002Fspan>\n    <div style=\"display:flex; gap:22px\">\n      <a href=\"#papan\" style=\"color:#3F4C51\">KEBIJAKAN PRIVASI<\u002Fa>\n      <a href=\"#papan\" style=\"color:#3F4C51\">SYARAT PENGGUNAAN<\u002Fa>\n      <a href=\"#pemilik\" style=\"color:#3F4C51\">LAPOR LOWONGAN PALSU<\u002Fa>\n      <span>© 2026 JAKARTA<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultRadius&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:5,&quot;options&quot;:[2,5,8,12],&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Papan&quot;,&quot;unit&quot;:&quot; km&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0A1B20&quot;,&quot;options&quot;:[&quot;#BF6B25&quot;,&quot;#3F4C51&quot;,&quot;#0A1B20&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tampilan&quot;}}\">\nclass Component extends DCLogic {\n  state = { radius: null, hover: -1 };\n\n  get radius() { return this.state.radius ?? this.props.defaultRadius ?? 5; }\n\n  all() {\n    return [\n      { km: 0.8, title: \"Kasir Toko Material\", company: \"Sumber Jaya Material\", tag: \"Shift pagi\", area: \"Jagakarsa\", salary: \"3,2 – 3,8 jt\" },\n      { km: 1.4, title: \"Barista Shift Pagi\", company: \"Kopi Sudut Lenteng\", tag: \"Bisa fresh grad\", area: \"Cilandak\", salary: \"3,0 jt + tip\" },\n      { km: 2.3, title: \"Staf Gudang Sore\", company: \"Nusa Kirim Logistik\", tag: \"Lembur dibayar\", area: \"Pasar Minggu\", salary: \"3,5 jt\" },\n      { km: 3.1, title: \"Teknisi AC Panggilan\", company: \"Adem Servis 24\", tag: \"Bawa motor sendiri\", area: \"Jagakarsa\", salary: \"Per panggilan\" },\n      { km: 4.6, title: \"Admin Penjualan\", company: \"Griya Sehat Farma\", tag: \"Senin – Jumat\", area: \"Pasar Minggu\", salary: \"4,1 jt\" },\n      { km: 6.2, title: \"Pramuniaga Toko Bangunan\", company: \"Cipta Baja Mandiri\", tag: \"Ada mess\", area: \"Cilandak\", salary: \"3,4 jt\" },\n      { km: 8.5, title: \"Kurir Area Selatan\", company: \"Antar Cepat Selatan\", tag: \"Harian\", area: \"Pasar Minggu\", salary: \"150 rb/hari\" },\n      { km: 11.0, title: \"Supervisor Dapur\", company: \"Warung Rasa Ibu\", tag: \"Pengalaman 1 thn\", area: \"Jagakarsa\", salary: \"5,0 jt\" }\n    ];\n  }\n\n  rupiah(n) { return \"Rp \" + Math.round(n / 1000) + \" rb\"; }\n\n  renderVals() {\n    const r = this.radius;\n    const accent = this.props.accentColor ?? \"#BF6B25\";\n    const list = this.all().filter(j => j.km <= r);\n    const shown = list.slice(0, 6);\n    const hidden = list.length - shown.length;\n    const hover = this.state.hover;\n\n    const rows = shown.map((j, i) => {\n      const on = i === hover;\n      const dailyCost = Math.max(4000, Math.round(j.km * 2 * 1400 / 500) * 500);\n      return {\n        no: String(i + 1).padStart(2, \"0\"),\n        title: j.title, company: j.company, tag: j.tag, area: j.area,\n        dist: j.km.toFixed(1).replace(\".\", \",\") + \" km\",\n        ongkos: this.rupiah(dailyCost),\n        salary: j.salary,\n        bg: on ? \"#0A1B20\" : \"transparent\",\n        fg: on ? \"#E2E0D9\" : \"#0A1B20\",\n        dim: on ? \"#87857F\" : \"#3F4C51\",\n        accent: on ? accent : \"#0A1B20\",\n        btnBorder: on ? accent : \"#0A1B20\",\n        btnBg: on ? accent : \"transparent\",\n        btnFg: on ? \"#0A1B20\" : \"#0A1B20\",\n        onEnter: () => this.setState({ hover: i }),\n        onLeave: () => this.setState({ hover: -1 })\n      };\n    });\n\n    const chips = [2, 5, 8, 12].map(v => ({\n      label: v + \" KM\",\n      bg: v === r ? \"#0A1B20\" : \"transparent\",\n      fg: v === r ? \"#E2E0D9\" : \"#0A1B20\",\n      onClick: () => this.setState({ radius: v, hover: -1 })\n    }));\n\n    const nearDaily = Math.max(4000, Math.round(r * 2 * 1400 / 500) * 500);\n    const farDaily = 26000;\n    const nearMin = Math.round(r * 4.5) + 8;\n\n    return {\n      radius: r,\n      shownCount: list.length,\n      rows, chips,\n      open: !!this.state.open,\n      caretRot: this.state.open ? \"rotate(180deg)\" : \"rotate(0deg)\",\n      pickerBorder: this.state.open ? accent : \"#0A1B20\",\n      toggleOpen: () => this.setState(s => ({ open: !s.open })),\n      radiusOptions: [\n        { v: 2, note: \"JALAN KAKI\" },\n        { v: 5, note: \"SEKALI OJEK\" },\n        { v: 8, note: \"ANGKOT\" },\n        { v: 12, note: \"KRL / BUS\" }\n      ].map(o => ({\n        label: o.v + \" km\",\n        note: o.note,\n        bg: o.v === r ? accent : \"transparent\",\n        fg: o.v === r ? \"#E2E0D9\" : \"#0A1B20\",\n        onClick: () => this.setState({ radius: o.v, open: false, hover: -1 })\n      })),\n      hiddenNote: hidden > 0\n        ? hidden + \" lowongan lain di radius ini muncul saat kamu buka papan penuh\"\n        : \"Perbesar radius untuk melihat lowongan yang sedikit lebih jauh\",\n      nearDaily: this.rupiah(nearDaily),\n      nearTime: nearMin + \" mnt\",\n      monthlySave: this.rupiah((farDaily - nearDaily) * 22),\n      monthlyHours: Math.max(1, Math.round((130 - nearMin) * 2 * 22 / 60)),\n      pains: [\n        { n: \"01\", text: \"Lowongan bagus ternyata di Tangerang, ongkos tidak masuk hitungan.\", fix: \"Papan hanya tampil sejauh radius yang kamu izinkan\" },\n        { n: \"02\", text: \"Ditawari kerja tapi diminta bayar biaya administrasi lebih dulu.\", fix: \"Perekrut lolos verifikasi dokumen dulu, baru boleh posting\" },\n        { n: \"03\", text: \"Lamaran dikirim, lalu hilang tanpa satu pun kabar.\", fix: \"Status lamaran terlihat sampai keputusan akhir\" }\n      ],\n      pledge: [\"ONGKOS DIHITUNG PP\", \"ANGKOT + KRL + OJEK\", \"BUKAN ESTIMASI KOSONG\"],\n      trust: [\n        { n: \"01\", title: \"Dokumen usaha diperiksa orang\", body: \"Status pending tidak bisa memasang satu lowongan pun. Yang gagal verifikasi tidak pernah masuk papan.\" },\n        { n: \"02\", title: \"Nol rupiah dari pelamar\", body: \"Perekrut yang meminta uang bisa dilaporkan dari halaman lowongannya, dan kami turunkan.\" },\n        { n: \"03\", title: \"CV bukan barang dagangan\", body: \"Akses file dibatasi waktu dan hanya untuk perekrut yang kamu lamar. Sesuai UU PDP No. 27/2022.\" }\n      ],\n      tabs: [\"0812…\", \"0812…\", \"0812…\", \"0812…\", \"0812…\"]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
